services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ecom-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      DATABASE_URL: pgsql://ecom:ecom@db:5432/ecom
      REDIS_URL: redis://cache:6379
    volumes:
      - ./:/var/www/html:cached
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - ecom

  web:
    image: nginx:1.27-alpine
    container_name: ecom-web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ecom

  db:
    image: postgres:16-alpine
    container_name: ecom-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
      POSTGRES_DB: ecom
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom -d ecom"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ecom

  cache:
    image: redis:7-alpine
    container_name: ecom-cache
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ecom

volumes:
  pgdata:
  redisdata:

networks:
  ecom:
    driver: bridge
